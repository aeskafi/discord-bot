[tool.poetry]
name = "discord-bot"
version = "1.0.0"
description = "A versatile Discord bot for inspirations, custom encouragements, and scheduled reminders."
authors = ["Arham Eskafi <contact@arham.dev>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.8"
"discord.py" = "^2.3.0"
requests = "^2.28.0"
Flask = "^2.3.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"